name: Release

on:
  # a version tag is the only push that builds, and the only thing that
  # publishes: scripts/release.js skips the upload on anything else, so pushing
  # a branch or a fix costs nothing and releases nothing.
  push:
    tags:
      - 'v*'
  # anything else is asked for by hand, one system at a time if that is what is
  # wanted. A run that is not on a tag builds and keeps what it built without
  # publishing, which is how a system is tried before a version is tagged for it.
  workflow_dispatch:
    inputs:
      platform:
        description: Which system to build for
        type: choice
        default: all
        options:
          - all
          - windows
          - mac
          - linux

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # which systems to build for. A tag builds all of them and so does asking for
  # all; asking for one builds one. It has to be decided here rather than in the
  # release job's own if: a job's if runs before its matrix exists, so matrix is
  # not a context it can read.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          {
            case "${{ inputs.platform }}" in
              windows)
                echo 'matrix={"include":[{"os":"windows-latest","platform":"windows"}]}'
                ;;
              mac)
                echo 'matrix={"include":[{"os":"macos-latest","platform":"mac"}]}'
                ;;
              linux)
                echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux","targets":"AppImage,deb,rpm,tar.gz"}]}'
                ;;
              *)
                echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux","targets":"AppImage,deb,rpm,tar.gz"},{"os":"macos-latest","platform":"mac"},{"os":"windows-latest","platform":"windows"}]}'
                ;;
            esac
          } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      # the release and its assets are created with the workflow token
      contents: write
      # and each build keeps what it made, so a system can be tried before a
      # version is tagged for it
      actions: write
    strategy:
      # a system that fails to build must not cancel the others
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Release on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      - run: yarn bootstrap
      # A mac build that is not signed and notarized opens as "Tinkr is damaged
      # and can't be opened": Gatekeeper is refusing a bundle it cannot check,
      # not reporting a bad download. electron-builder signs from CSC_LINK and
      # notarizes from the APPLE_* credentials, and skips both when they are
      # absent, so a fork without them still builds — just unsigned, which is
      # why they are only passed on when they exist.
      - name: Mac build environment
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No Developer ID certificate: this mac build is unsigned" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # signed but not notarized is not a step forward: macOS wants a ticket
          # as well, and an app without one is still reported as damaged
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::CSC_LINK is set but APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are not. A signed build that is not notarized still opens as damaged on macOS."
            exit 1
          fi
          {
            echo "CSC_LINK=$CSC_LINK"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - run: yarn release
        env:
          BUILD_TARGETS: ${{ matrix.targets }}
      # The build above says what it did; this is the reader's side of it, and
      # Gatekeeper's own verdict is the one that decides whether the download
      # opens. A signing mistake fails here rather than in a user's hands.
      - name: Check the mac build opens
        if: matrix.os == 'macos-latest'
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No certificate, nothing to check" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          app=$(ls -d build/mac*/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      # a build without a tag publishes nothing, so this is how what it built is
      # read: the installers stay on the run for two weeks
      - name: Keep what was built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinkr-${{ matrix.platform }}-installers
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/*.exe
            build/*.dmg
            build/*.zip
            build/*.AppImage
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.nupkg
            build/RELEASES
            build/latest*.yml
