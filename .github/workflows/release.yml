name: Release

on:
  # every push builds, but only a version tag publishes a release
  # (scripts/release.js skips the upload on anything else)
  push:
  # a build can be started by hand, without a new commit
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      # the release and its assets are created with the workflow token
      contents: write
    strategy:
      # a system that fails to build must not cancel the others
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          # snapcraft is not installed on the runner, so the linux build makes
          # the other installers (scripts/package.js reads BUILD_TARGETS)
          - os: ubuntu-latest
            targets: AppImage,deb,rpm,tar.gz
    name: Release on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      - run: yarn bootstrap
      # an empty CSC_LINK makes electron-builder look for a certificate that is
      # not here, so the signing secrets are only passed on when they exist
      - name: Mac build environment
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            {
              echo "CSC_LINK=$CSC_LINK"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - run: yarn release
        env:
          BUILD_TARGETS: ${{ matrix.targets }}
